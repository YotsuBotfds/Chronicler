name: Current090 passive profile source hold
on:
  push:
    branches: [lead/cloud-current090-passive-profile-20261029]
    paths: [.github/workflows/current090-passive-profile.yml]
permissions:
  contents: read
  actions: read
jobs:
  current090-passive-profile:
    if: >-
      github.repository == 'YotsuBotfds/Chronicler' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.ref == 'refs/heads/lead/cloud-current090-passive-profile-20261029' &&
      github.workflow_ref == 'YotsuBotfds/Chronicler/.github/workflows/current090-passive-profile.yml@refs/heads/lead/cloud-current090-passive-profile-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BLIS_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '1'
      GOTO_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHON_CPU_COUNT: '1'
      RAYON_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      OPENBLAS_THREAD_TIMEOUT: '16'
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0900f3d203cc74102809bb871a1a057ba91a951f
          path: producer
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1421621b4393d08cedb0d3505ae26b96dfa6563c
          path: ownership
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.17'
      - name: Owned metadata preflight, admission, six roles and strict proof
        id: owner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -P -s -B -X cpu_count=1 "$GITHUB_WORKSPACE/control/scripts/current090_profile_owner.py" \
            --control "$GITHUB_WORKSPACE/control" --source "$GITHUB_WORKSPACE/producer" \
            --controls "$GITHUB_WORKSPACE/ownership" --prefix "$RUNNER_TEMP/passive090-prefix" \
            --root "$RUNNER_TEMP/passive090-study"
      - name: Always retain bounded metadata, including setup or collection failure
        id: publication
        if: always()
        env:
          OWNER_OUTCOME: ${{ steps.owner.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$GITHUB_WORKSPACE/control/scripts/current090_profile_publish.py"; then
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/control/scripts/current090_profile_publish.py" \
              --root "$RUNNER_TEMP/passive090-study" --output "$RUNNER_TEMP/passive090-publication" \
              --owner-outcome "$OWNER_OUTCOME" --source "$GITHUB_SHA"
          else
            /usr/bin/python3 -I -B -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"passive090-publication"; p.mkdir(exist_ok=False); (p/"publication.json").write_text(json.dumps({"complete":False,"metadata_only":True,"source_publication_qualified":False,"owner_step_outcome":os.environ["OWNER_OUTCOME"],"source":os.environ["GITHUB_SHA"],"missing_control_publisher":True})+"\n"); raise SystemExit(2)'
          fi
      - name: Publish metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current090-passive-profile-metadata-${{ github.sha }}
          path: ${{ runner.temp }}/passive090-publication
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
