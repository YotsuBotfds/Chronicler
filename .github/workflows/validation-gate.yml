name: Validation Gate

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Validation profile to run
        required: true
        default: full
        type: choice
        options:
          - subset
          - full
          - determinism-off
          - determinism-hybrid
      source_sha:
        description: Exact full source commit to validate (empty uses this workflow commit)
        required: false
        default: ""
        type: string
      worldgen:
        description: Existing validation world family
        required: true
        default: template
        type: choice
        options:
          - template
          - procedural
      require_strict_regression:
        description: Fail full-profile calibrated-floor regression passes
        required: false
        default: false
        type: boolean
      baseline_report:
        description: Optional baseline validation report path for comparison
        required: false
        default: ""
        type: string
      fail_on_regression:
        description: Fail when baseline comparison detects a regression
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 8 * * 0"

permissions:
  contents: read

jobs:
  canonical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Resolve exact validation source
        id: validation_source
        env:
          REQUESTED_SOURCE_SHA: ${{ github.event.inputs.source_sha || github.sha }}
        shell: bash
        run: |
          if [[ ! "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full40-hex commit" >&2
            exit 1
          fi
          printf '%s\n' "sha=$REQUESTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.validation_source.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies from the lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv>=0.5,<1"
          uv lock --check
          uv sync --frozen --no-dev --python "$(command -v python)"
          uv pip install --python .venv/bin/python "maturin>=1.5,<2"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check comparison inputs before native build
        env:
          BASELINE_REPORT_INPUT: ${{ github.event.inputs.baseline_report || '' }}
          FAIL_ON_REGRESSION_INPUT: ${{ github.event.inputs.fail_on_regression || 'false' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from chronicler.validation_gate import load_validation_report
          baseline = os.environ["BASELINE_REPORT_INPUT"]
          if os.environ["FAIL_ON_REGRESSION_INPUT"] == "true" and not baseline:
              raise SystemExit("fail_on_regression requires baseline_report")
          if baseline:
              load_validation_report(Path(baseline))
          PY

      - name: Build Rust extension wheel
        run: |
          cd chronicler-agents
          python -m maturin build --release --locked
          uv pip install --python ../.venv/bin/python target/wheels/*.whl

      - name: Record actual validation source and own compiled wheel
        env:
          VALIDATION_CHECKOUT_SHA: ${{ steps.validation_source.outputs.sha }}
          VALIDATION_CONTROLLER_SHA: ${{ github.workflow_sha }}
          VALIDATION_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          python - <<'PY'
          import hashlib
          import importlib
          from importlib.machinery import ExtensionFileLoader
          import json
          import os
          from pathlib import Path
          import platform
          import shutil
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(["git", "--no-replace-objects", *args], text=True).strip()

          source = git("rev-parse", "HEAD")
          assert source == os.environ["VALIDATION_CHECKOUT_SHA"]
          assert not git("status", "--porcelain", "--untracked-files=no")
          sys.path.insert(0, str(Path("scripts").resolve()))
          from native_wheel_receipt import wheel_receipt
          from chronicler.batch_manifest import source_identity, environment_identity
          package = importlib.import_module("chronicler_agents")
          native = importlib.import_module("chronicler_agents.chronicler_agents")
          assert type(native.__spec__.loader) is ExtensionFileLoader
          native_path = Path(native.__file__).resolve()
          assert native_path.is_relative_to(Path(sys.prefix).resolve())
          classes = ["AgentSimulator", "EcologySimulator", "PoliticsSimulator"]
          assert all(isinstance(getattr(native, name, None), type) and
                     getattr(package, name, None) is getattr(native, name) for name in classes)
          receipt = wheel_receipt(Path("chronicler-agents/target/wheels"), native_path, source)
          out = Path("output/github-validation") / os.environ["GITHUB_RUN_ID"]
          build = out / "native-build"
          build.mkdir(parents=True, exist_ok=False)
          wheel = Path("chronicler-agents/target/wheels") / receipt["wheel"]["filename"]
          shutil.copyfile(wheel, build / wheel.name)
          identity = {
              "schema": 1, "kind": "validation-own-source-build-identity",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "job": os.environ["GITHUB_JOB"],
              "controller_sha": os.environ["VALIDATION_CONTROLLER_SHA"],
              "workflow_ref": os.environ["VALIDATION_WORKFLOW_REF"],
              "event_sha": os.environ["GITHUB_SHA"],
              "checked_out_source_sha": source,
              "source_tree": git("rev-parse", "HEAD^{tree}"),
              "native_tree": git("rev-parse", "HEAD:chronicler-agents"),
              "package_source": source_identity(), "environment": environment_identity(),
              "native_module": str(native_path), "compiled_class_aliases": classes,
              "wheel_receipt": receipt,
              "wheel_receipt_helper_sha256": hashlib.sha256(Path("scripts/native_wheel_receipt.py").read_bytes()).hexdigest(),
              "rustc": subprocess.check_output(["rustc", "--version", "--verbose"], text=True),
              "cargo": subprocess.check_output(["cargo", "--version"], text=True),
              "python": sys.version, "platform": platform.platform(),
              "workspace_free_bytes": shutil.disk_usage(Path.cwd()).free,
              "cpu_affinity": sorted(os.sched_getaffinity(0)),
              "linux_memory_metadata": Path("/proc/meminfo").read_text(),
              "scope": "Actual own wheel/native/class identity, no simulator construction or scientific pass."
          }
          with (out / "validation_identity.json").open("x") as stream:
              json.dump(identity, stream, sort_keys=True, indent=2)
              stream.write("\n")
          PY

      - name: Admit resources before World
        env:
          VALIDATION_CHECKOUT_SHA: ${{ steps.validation_source.outputs.sha }}
          VALIDATION_CONTROLLER_SHA: ${{ github.workflow_sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath

          def assess_resource_policy(counters):
              bounds = {"available_memory_bytes": 8 * 1024**3,
                        "output_free_bytes": 16 * 1024**3,
                        "output_free_inodes": 100000, "effective_cpu_slots": 3}
              errors = list(counters["errors"])
              host = counters["host_available_memory_bytes"]
              memory = counters["memory_headroom_bytes"]
              cpus = counters["cpu_slot_limits"]
              disk, inodes = counters["output_free_bytes"], counters["output_free_inodes"]
              integer = lambda value: type(value) is int and value >= 0
              if not integer(host) or type(memory) is not list or not all(integer(v) for v in memory):
                  errors.append("unknown-or-invalid-memory")
                  available = None
              else:
                  available = min([host, *memory])
              if type(cpus) is not list or not cpus or not all(integer(v) for v in cpus):
                  errors.append("unknown-or-invalid-cpu")
                  cpu = None
              else:
                  cpu = min(cpus)
              values = {"available_memory_bytes": available, "effective_cpu_slots": cpu,
                        "output_free_bytes": disk, "output_free_inodes": inodes}
              checks = {key: integer(value) and value >= bounds[key] for key, value in values.items()}
              return {"bounds": bounds, "effective_counters": values, "checks": checks,
                      "observation_errors": errors, "admitted": not errors and all(checks.values()),
                      "measured_source_fit": False,
                      "scope": "Point-in-time admission policy, not measured fit or a runtime resource guarantee."}

          def cgroup_mount_status(root, version, text):
              """Classify only a conventional visible hierarchy, without probing it."""
              try:
                  assert type(text) is str and len(text) <= 16384
                  mounts = []
                  for line in text.splitlines():
                      left, right = line.split(" - ", 1)
                      fields, filesystem = left.split(), right.split()
                      assert len(fields) >= 6 and len(filesystem) >= 3
                      # Escaped/nonconventional hierarchy paths are outside this policy.
                      mounts.append((fields[3], fields[4], filesystem[0], filesystem[2]))
                  expected = "cgroup2" if version == 2 else "cgroup"
                  selected = [row for row in mounts if row[1] == root]
                  assert len(selected) == 1 and selected[0][0] == "/" and selected[0][2] == expected
                  assert not any(row[1].startswith(root + "/") for row in mounts)
                  if version == 1:
                      required = root.rsplit("/", 1)[1].split(",")
                      assert all(controller in selected[0][3].split(",") for controller in required)
                  return "confirmed-visible-root"
              except (AssertionError, ValueError, TypeError, AttributeError):
                  return "unavailable-or-masked"


          def cgroup_coverage_errors(hierarchies):
              """Every selected process resource needs an observed hierarchy."""
              covered = set()
              for version, kind in hierarchies:
                  if version not in (1, 2) or kind not in ("cpu", "memory", "cpu-memory"):
                      return ["unsupported-controller-coverage"]
                  covered.update(controller for controller in ("cpu", "memory") if controller in kind)
              return ["unavailable-controller-hierarchy:" + controller
                      for controller in ("cpu", "memory") if controller not in covered]


          def translate_cgroup_controls(version, kind, is_root, mount_state, observations, selected_v1):
              """Translate supplied reads only; missing is never synonymous with unlimited."""
              result = {"memory_headroom_bytes": [], "cpu_slot_limits": [], "errors": [], "controllers": {}}
              def bad(message):
                  result["errors"].append(message)
              def observed(name):
                  row = observations.get(name)
                  if (type(row) is not tuple or len(row) != 2 or row[0] not in ("value", "missing", "unavailable")
                          or (row[0] == "value" and type(row[1]) is not str)
                          or (row[0] != "value" and row[1] is not None)):
                      bad("invalid-observation:" + name)
                      return "unavailable", None
                  return row
              def words(name):
                  state, value = observed(name)
                  if state != "value":
                      bad("required-controller-metadata:" + name + ":" + state)
                      return None
                  tokens = value.split()
                  if len(tokens) != len(set(tokens)) or any(not token.replace("_", "").isalnum() for token in tokens):
                      bad("invalid-controller-metadata:" + name)
                      return None
                  return tokens
              def number(value):
                  assert type(value) is str and value.isascii() and value.isdecimal()
                  return int(value)
              if (version not in (1, 2) or kind not in ("cpu", "memory", "cpu-memory")
                      or type(is_root) is not bool or mount_state != "confirmed-visible-root"):
                  bad("unavailable-or-masked-cgroup-mount")
                  return result
              for controller in ("memory", "cpu"):
                  if controller not in kind:
                      continue
                  if version == 1:
                      state = "required"
                  elif is_root:
                      available = words("cgroup.controllers")
                      if available is None:
                          continue
                      if controller in available:
                          state = "root-interface"
                      elif controller in selected_v1:
                          state = "covered-by-selected-v1"
                      else:
                          proc_state, proc_text = observed("/proc/cgroups")
                          try:
                              assert proc_state == "value"
                              lines = [line.split() for line in proc_text.splitlines() if line.strip()]
                              assert lines and lines[0] == ["#subsys_name", "hierarchy", "num_cgroups", "enabled"]
                              rows = lines[1:]
                              assert 0 < len(rows) <= 256 and len({row[0] for row in rows}) == len(rows)
                              assert all(len(row) == 4 and row[0].replace("_", "").isalnum()
                                         and row[1].isascii() and row[1].isdecimal()
                                         and row[2].isascii() and row[2].isdecimal()
                                         and row[3] in ("0", "1") for row in rows)
                              matches = [row for row in rows if row[0] == controller]
                              assert len(matches) <= 1
                              assert not matches or matches[0][3] == "0"
                              state = "kernel-disabled-or-not-applicable"
                          except (AssertionError, TypeError, AttributeError):
                              bad("unavailable-root-controller:" + controller)
                              continue
                  else:
                      available = words("parent.cgroup.controllers")
                      enabled = words("parent.cgroup.subtree_control")
                      if available is None or enabled is None:
                          continue
                      if not set(enabled).issubset(available):
                          bad("contradictory-parent-controller-metadata:" + controller)
                          continue
                      state = "required" if controller in enabled else "disabled-for-child"
                  names = (("memory.max", "memory.high", "memory.current") if version == 2 else
                           ("memory.limit_in_bytes", "memory.soft_limit_in_bytes", "memory.usage_in_bytes")) if controller == "memory" else (
                           ("cpu.max",) if version == 2 else ("cpu.cfs_quota_us", "cpu.cfs_period_us"))
                  values = [observed(name) for name in names]
                  row = {"state": state, "reads": {name: list(value) for name, value in zip(names, values)}}
                  result["controllers"][controller] = row
                  if any(value[0] == "unavailable" for value in values):
                      bad("unavailable-controller-read:" + controller)
                      continue
                  if state in ("disabled-for-child", "covered-by-selected-v1", "kernel-disabled-or-not-applicable"):
                      if any(value[0] != "missing" for value in values):
                          bad("contradictory-disabled-controller:" + controller)
                      continue
                  if state == "root-interface":
                      # Linux's hierarchy root has no own v2 quota/limit knobs. Root
                      # absence is admitted only after mount and controller metadata join.
                      root_absent = values[0][0] == "missing" and (controller == "cpu" or values[1][0] == "missing")
                      if root_absent:
                          if controller == "memory" and values[2][0] == "value":
                              try:
                                  number(values[2][1])
                              except (AssertionError, ValueError):
                                  bad("invalid-root-memory-usage")
                                  continue
                          row["state"] = "root-no-own-limit"
                          continue
                  if any(value[0] != "value" for value in values):
                      bad("missing-required-controller-read:" + controller)
                      continue
                  try:
                      texts = [value[1] for value in values]
                      if controller == "memory":
                          maximum, soft, usage = texts
                          used = number(usage)
                          bounds = [maximum, soft]
                          finite = []
                          for index, bound in enumerate(bounds):
                              if version == 2 and bound == "max":
                                  continue
                              limit = number(bound)
                              if version == 1 and index == 1 and limit == 0:
                                  continue
                              finite.append(max(0, limit - used))
                          result["memory_headroom_bytes"].extend(finite)
                          row["state"] = "limited" if finite else "explicit-unlimited"
                      else:
                          fields = texts[0].split() if version == 2 else texts
                          assert len(fields) == 2
                          period = number(fields[1])
                          assert period > 0
                          if fields[0] == ("max" if version == 2 else "-1"):
                              row["state"] = "explicit-unlimited"
                          else:
                              quota = number(fields[0])
                              assert quota > 0
                              result["cpu_slot_limits"].append(quota // period)
                              row["state"] = "limited"
                  except (AssertionError, ValueError, TypeError):
                      bad("invalid-controller-value:" + controller)
              return result

          errors = []
          def problem(message):
              if len(errors) < 16:
                  errors.append(message[:240])
          def small(path, required=False):
              try:
                  with path.open("r", encoding="ascii") as stream:
                      text = stream.read(16385)
                  if len(text) > 16384:
                      raise ValueError("metadata bound")
                  return text.strip()
              except FileNotFoundError:
                  if required:
                      problem("missing:" + str(path))
              except (OSError, UnicodeError, ValueError) as exc:
                  problem("unreadable:" + str(path) + ":" + type(exc).__name__)
              return None

          host_available = None
          meminfo = small(Path("/proc/meminfo"), True)
          try:
              rows = [line.split() for line in (meminfo or "").splitlines() if line.startswith("MemAvailable:")]
              assert len(rows) == 1 and len(rows[0]) == 3 and rows[0][2] == "kB"
              host_available = int(rows[0][1]) * 1024
          except (ValueError, AssertionError):
              problem("MemAvailable-unavailable")

          cpu_limits, cpu_observations = [], {}
          try:
              from chronicler.cpu_budget import _cgroup_limits
              cpu_limits.extend(_cgroup_limits())
              cpu_observations["existing_cgroup_slot_limits"] = list(cpu_limits)
          except Exception as exc:
              problem("cpu_budget-unavailable:" + type(exc).__name__)
          for name, call in (("visible", os.cpu_count),
                             ("process", getattr(os, "process_cpu_count", lambda: None)),
                             ("affinity", lambda: len(os.sched_getaffinity(0)))):
              try:
                  value = call()
                  cpu_observations[name] = value
                  if type(value) is int and value > 0:
                      cpu_limits.append(value)
                  elif name != "process":
                      problem("cpu-counter-unavailable:" + name)
              except (OSError, AttributeError, NotImplementedError) as exc:
                  problem("cpu-counter-unavailable:" + name + ":" + type(exc).__name__)

          membership = small(Path("/proc/self/cgroup"), True)
          locations = {}
          recognized = False
          for line in (membership or "").splitlines():
              fields = line.split(":", 2)
              if len(fields) != 3:
                  problem("malformed-cgroup-membership")
                  continue
              hierarchy, controllers, member = fields
              relative = PurePosixPath(member)
              if not relative.is_absolute() or ".." in relative.parts or len(member) > 1024:
                  problem("unsupported-cgroup-membership-path")
                  continue
              roots = []
              if hierarchy == "0" and not controllers:
                  roots = [(Path("/sys/fs/cgroup"), 2, "cpu-memory")]
              else:
                  kinds = controllers.split(",")
                  if "memory" in kinds:
                      roots.append((Path("/sys/fs/cgroup/memory"), 1, "memory"))
                  if "cpu" in kinds:
                      candidates = [Path("/sys/fs/cgroup/cpu"), Path("/sys/fs/cgroup/cpu,cpuacct")]
                      roots.extend((path, 1, "cpu") for path in candidates if path.is_dir())
                      if not any(path.is_dir() for path in candidates):
                          problem("unsupported-cgroup-cpu-mount")
              for root, version, kind in roots:
                  recognized = True
                  directory = root.joinpath(*relative.parts[1:])
                  if not directory.is_dir():
                      problem("unsupported-cgroup-directory:" + str(directory))
                      continue
                  while True:
                      locations[(str(directory), version, kind)] = (directory, root)
                      if directory == root:
                          break
                      directory = directory.parent
          if not recognized:
              problem("no-supported-cgroup-hierarchy")
          if len(locations) > 64:
              problem("cgroup-observation-count-bound")
          # Each missing read remains tagged until controller/mount metadata establishes
          # whether that interface is required, disabled, root-only absent or unlimited.
          def observe(path):
              try:
                  with path.open("r", encoding="ascii") as stream:
                      value = stream.read(16385)
                  if len(value) > 16384:
                      raise ValueError("metadata bound")
                  return "value", value.strip()
              except FileNotFoundError:
                  return "missing", None
              except (OSError, UnicodeError, ValueError):
                  return "unavailable", None

          mountinfo = small(Path("/proc/self/mountinfo"), True)
          kernel_controllers = observe(Path("/proc/cgroups"))
          selected_v1 = {controller for _, version, kind in locations if version == 1
                         for controller in ("cpu", "memory") if controller in kind}
          for issue in cgroup_coverage_errors([(version, kind) for _, version, kind in locations]):
              problem(issue)
          memory_headrooms, cgroups = [], []
          for (name, version, kind), (directory, root) in sorted(locations.items())[:64]:
              mount_state = cgroup_mount_status(str(root), version, mountinfo)
              observations = {"/proc/cgroups": kernel_controllers}
              if version == 2:
                  metadata = {"cgroup.controllers": directory / "cgroup.controllers"} if directory == root else {
                      "parent.cgroup.controllers": directory.parent / "cgroup.controllers",
                      "parent.cgroup.subtree_control": directory.parent / "cgroup.subtree_control"}
                  observations.update({key: observe(path) for key, path in metadata.items()})
              if "memory" in kind:
                  memory_names = ("memory.max", "memory.high", "memory.current") if version == 2 else (
                      "memory.limit_in_bytes", "memory.soft_limit_in_bytes", "memory.usage_in_bytes")
                  observations.update({key: observe(directory / key) for key in memory_names})
              if "cpu" in kind:
                  cpu_names = ("cpu.max",) if version == 2 else ("cpu.cfs_quota_us", "cpu.cfs_period_us")
                  observations.update({key: observe(directory / key) for key in cpu_names})
              translated = translate_cgroup_controls(version, kind, directory == root, mount_state, observations, selected_v1)
              for issue in translated["errors"]:
                  problem(issue + ":" + name)
              memory_headrooms.extend(translated["memory_headroom_bytes"])
              cpu_limits.extend(translated["cpu_slot_limits"])
              cgroups.append({"path": name, "version": version, "kind": kind, "root": str(root),
                             "mount_state": mount_state, "controller_metadata": {
                                 key: list(value) for key, value in observations.items()
                                 if key != "/proc/cgroups"},
                             "translation": translated})

          out = Path("output/github-validation") / os.environ["GITHUB_RUN_ID"]
          free_bytes = free_inodes = None
          try:
              volume = os.statvfs(out)
              free_bytes, free_inodes = volume.f_bavail * volume.f_frsize, volume.f_favail
          except OSError as exc:
              problem("output-statvfs-unavailable:" + type(exc).__name__)
          counters = {"host_available_memory_bytes": host_available,
                      "memory_headroom_bytes": memory_headrooms, "cpu_slot_limits": cpu_limits,
                      "output_free_bytes": free_bytes, "output_free_inodes": free_inodes, "errors": errors}
          decision = assess_resource_policy(counters)
          build_raw = (out / "validation_identity.json").read_bytes()
          build = json.loads(build_raw)
          assert build["checked_out_source_sha"] == os.environ["VALIDATION_CHECKOUT_SHA"]
          record = {"schema": 1, "kind": "validation-pre-World-resource-admission",
                    "source": build["checked_out_source_sha"], "controller_sha": os.environ["VALIDATION_CONTROLLER_SHA"],
                    "run_id": int(os.environ["GITHUB_RUN_ID"]), "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                    "build_identity_sha256": hashlib.sha256(build_raw).hexdigest(),
                    "counters": counters, "cpu_observations": cpu_observations,
                    "cgroup_observations": cgroups, "decision": decision,
                    "cgroup_mountinfo": mountinfo, "kernel_controller_observation": list(kernel_controllers),
                    "cgroup_scope": "Conventional visible unmasked Linux hierarchy and ancestors; absent controls require explicit disabled/root metadata, unknown observations refuse.",
                    "scope": "Admission policy after own build and before World; not measured new-source fit."}
          raw = (json.dumps(record, sort_keys=True, indent=2) + "\n").encode()
          assert len(raw) <= 131072, "resource record bound"
          fd = os.open(out / "resource_admission.json", os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(fd, "wb") as stream:
              assert stream.write(raw) == len(raw)
              stream.flush()
              os.fsync(stream.fileno())
              os.fchmod(stream.fileno(), 0o444)
          if not decision["admitted"]:
              raise SystemExit("Resource admission policy refused before World; resource_admission.json preserved")
          PY

      - name: Run canonical validation gate
        env:
          PROFILE_INPUT: ${{ github.event.inputs.profile || 'full' }}
          WORLDGEN_INPUT: ${{ github.event.inputs.worldgen || 'template' }}
          STRICT_REGRESSION_INPUT: ${{ github.event.inputs.require_strict_regression || 'false' }}
          BASELINE_REPORT_INPUT: ${{ github.event.inputs.baseline_report || '' }}
          FAIL_ON_REGRESSION_INPUT: ${{ github.event.inputs.fail_on_regression || 'false' }}
        shell: bash
        run: |
          PROFILE="$PROFILE_INPUT"
          STRICT_REGRESSION="$STRICT_REGRESSION_INPUT"
          BASELINE_REPORT="$BASELINE_REPORT_INPUT"
          FAIL_ON_REGRESSION="$FAIL_ON_REGRESSION_INPUT"
          EXTRA_ARGS=()
          if [[ "$STRICT_REGRESSION" == "true" ]]; then
            EXTRA_ARGS+=(--require-strict-regression)
          fi
          if [[ -n "$BASELINE_REPORT" ]]; then
            EXTRA_ARGS+=(--baseline-report "$BASELINE_REPORT")
          fi
          if [[ "$FAIL_ON_REGRESSION" == "true" ]]; then
            EXTRA_ARGS+=(--fail-on-regression)
          fi
          python scripts/m53b_run_validation.py \
            --profile "$PROFILE" \
            --worldgen "$WORLDGEN_INPUT" \
            --parallel 3 \
            --output-root "output/github-validation/${{ github.run_id }}" \
            "${EXTRA_ARGS[@]}"

      - name: Publish validation gate summary
        if: always()
        shell: bash
        run: |
          while IFS= read -r summary; do
            echo "## Validation gate summary: $summary" >> "$GITHUB_STEP_SUMMARY"
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done < <(if [ -d "output/github-validation/${{ github.run_id }}" ]; then find "output/github-validation/${{ github.run_id }}" -name 'gate_summary_*.md' -type f | sort; fi)
          while IFS= read -r summary; do
            echo "## Validation comparison summary: $summary" >> "$GITHUB_STEP_SUMMARY"
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done < <(if [ -d "output/github-validation/${{ github.run_id }}" ]; then find "output/github-validation/${{ github.run_id }}" -name 'compare_summary_*.md' -type f | sort; fi)

      - name: Collect compact validation evidence
        if: always()
        env:
          PROFILE_INPUT: ${{ github.event.inputs.profile || 'full' }}
          WORLDGEN_INPUT: ${{ github.event.inputs.worldgen || 'template' }}
          VALIDATION_CONTROLLER_SHA: ${{ github.workflow_sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import stat

          profile = os.environ["PROFILE_INPUT"]
          out = Path("output/github-validation") / os.environ["GITHUB_RUN_ID"]
          compact = Path(os.environ["RUNNER_TEMP"]) / (
              "validation-compact-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"])
          compact.mkdir(parents=True, exist_ok=False)
          layouts = {"full": "full_gate", "subset": "oracle_subset",
                     "determinism-off": "determinism_off", "determinism-hybrid": "determinism_hybrid"}
          batch = out / layouts[profile] / "batch_42"
          report_name = "validate_report_" + profile.replace("-", "_") + ".json"
          required = [out / "validation_identity.json", out / "resource_admission.json", batch / "batch_manifest.json",
                      batch / "run_manifest.json", batch / report_name,
                      batch / ("gate_decision_" + profile + ".json"),
                      batch / ("gate_summary_" + profile + ".md")]
          optional = [batch / ("compare_decision_" + profile + ".json"),
                      batch / ("compare_summary_" + profile + ".md")]
          identity = None
          if (out / "validation_identity.json").is_file():
              identity = json.loads((out / "validation_identity.json").read_text())
              required.append(out / "native-build" / identity["wheel_receipt"]["wheel"]["filename"])
          resource = None
          resource_sha = None
          if (out / "resource_admission.json").is_file():
              resource_raw = (out / "resource_admission.json").read_bytes()
              resource = json.loads(resource_raw)
              resource_sha = hashlib.sha256(resource_raw).hexdigest()
          if (batch / "run_manifest.json").is_file():
              run = json.loads((batch / "run_manifest.json").read_text())
              if run.get("ablation_oracles"):
                  required.append(batch.parent / "ablation_42" / "ablation_manifest.json")
          selected = required + [path for path in optional if path.exists()]
          missing = [str(path.relative_to(out)) for path in required if not path.is_file()]
          if resource is not None:
              if resource["decision"]["admitted"] is not True:
                  missing.append("resource_admission:not_admitted")
              if (identity is None or resource["source"] != identity["checked_out_source_sha"]
                      or resource["build_identity_sha256"] != hashlib.sha256((out / "validation_identity.json").read_bytes()).hexdigest()
                      or resource["controller_sha"] != os.environ["VALIDATION_CONTROLLER_SHA"]):
                  missing.append("resource_admission:build_identity_mismatch")
          records = []
          for path in selected:
              if not path.is_file():
                  continue
              info = path.lstat()
              assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and not path.is_symlink()
              assert path.resolve().is_relative_to(out.resolve())
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              records.append({"path": path.relative_to(out).as_posix(), "bytes": info.st_size, "sha256": digest})
          if identity is not None and (batch / "batch_manifest.json").is_file():
              manifest = json.loads((batch / "batch_manifest.json").read_text())
              assert manifest["source"]["git_sha"] == identity["checked_out_source_sha"]
              assert manifest["source"]["package_digest"] == identity["package_source"]["package_digest"]
              assert manifest["native"]["sha256"] == identity["wheel_receipt"]["installed_native"]["sha256"]
          MAX_COMPACT_BYTES = 7 * 1024 * 1024  # Leaves packaging room inside the existing8MiB ZIP intake limit.
          manifest = {"schema": 1, "kind": "validation-compact-evidence",
                      "source": None if identity is None else identity["checked_out_source_sha"],
                      "controller_sha": os.environ["VALIDATION_CONTROLLER_SHA"],
                      "run_id": int(os.environ["GITHUB_RUN_ID"]), "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                      "profile": profile, "worldgen": os.environ["WORLDGEN_INPUT"],
                      "resource_admission_sha256": resource_sha,
                      "resource_admitted": None if resource is None else resource["decision"]["admitted"],
                      "status": "INCOMPLETE" if missing else "EVIDENCE_COMPLETE",
                      "missing_required": missing, "files": records,
                      "body_budget_bytes": MAX_COMPACT_BYTES,
                      "scope": "Exact selected bodies only. Completeness is not a scientific gate pass; full raw archive is retained separately."}
          raw = (json.dumps(manifest, sort_keys=True, indent=2) + "\n").encode()
          fits = sum(row["bytes"] for row in records) + len(raw) <= MAX_COMPACT_BYTES
          if fits:
              for row in records:
                  target = compact / row["path"]
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(out / row["path"], target)
          else:
              manifest["status"] = "REFUSED_COMPACT_SIZE"
              manifest["files_not_copied"] = True
              raw = (json.dumps(manifest, sort_keys=True, indent=2) + "\n").encode()
          with (compact / "compact_manifest.json").open("xb") as stream:
              stream.write(raw)
          if missing or not fits:
              raise SystemExit("Incomplete or oversized compact evidence; raw archive remains independently retained")
          PY

      - name: Upload compact validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-gate-compact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation-compact-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-gate-${{ github.run_id }}
          path: output/github-validation/${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
