# DORMANT: separate source/policy review and one explicit activation required.
name: Four original checkpoint header observations

on:
  push:
    branches: [lead/cloud-wealth-floor-checkpoint-header-diagnostic-20261029]
    paths: [.github/workflows/wealth-floor-checkpoint-header-diagnostic.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: wealth-floor-checkpoint-header-diagnostic
  cancel-in-progress: false

jobs:
  headers:
    name: Observe four original checkpoint headers
    if: github.event_name == 'push' && github.ref == 'refs/heads/lead/cloud-wealth-floor-checkpoint-header-diagnostic-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHON_CPU_COUNT: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      GOTO_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Check out separately reviewed header control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: control
          persist-credentials: false
      - name: Set up stdlib-only registered interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.17"
      - name: Refuse pending new-volume registration before host or credential work
        run: |
          python -I -B - <<'PY'
          import importlib.util,sys
          if importlib.util.find_spec('chronicler_agents') is not None: raise SystemExit('native extension present')
          sys.path.insert(0,'control/scripts')
          import wealth_floor_checkpoint_header_diagnostic as H
          H.registration()
          assert all(v is None for v in H.A.REVIEWED_CANDIDATE_PROOFS.values())
          assert all(getattr(H.W,k) is None for k in ('REVIEWED_OUTPUTS','REVIEWED_CLOSURES','REVIEWED_OUTCOMES','REVIEWED_RESOURCE_POLICY','REVIEWED_COMPLETION'))
          PY
      - name: Stream only the two registered archives and observe four headers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B control/scripts/wealth_floor_checkpoint_header_diagnostic.py --execute
      - name: Preserve bounded header metadata after the first outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wealth-four-checkpoint-headers-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wealth-four-checkpoint-headers/diagnostic/
          if-no-files-found: warn
          retention-days: 30

# Whole archive files stay on the reader VM and are excluded from publication.
# No checkpoint file extraction, inner section inflation, restore or World.
