# DORMANT: source/pure review only; no primer activation authorized.
name: Wealth-floor production-runtime primer

on:
  push:
    branches: [lead/cloud-wealth-floor-production-primer-20261029]
    paths: [.github/workflows/wealth-floor-production-primer.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: wealth-floor-production-runtime-primer
  cancel-in-progress: false

jobs:
  primer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/lead/cloud-wealth-floor-production-primer-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      GOTO_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out reviewed control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: control
          persist-credentials: false

      - name: Set up exact registered interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.17"

      - name: Refuse pending pins and unsupported resources before staging
        id: registration
        shell: bash
        run: |
          set -euo pipefail
          python control/scripts/wealth_floor_production_primer.py
          python control/scripts/wealth_floor_production_primer.py --registration

      - name: Check out exact candidate Python source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 503070175e3e78d9014add158ead8f16ce940843
          path: candidate
          persist-credentials: false

      - name: Read closed producer publication metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ steps.registration.outputs.build_run_id }}
          BUILD_ARTIFACT: ${{ steps.registration.outputs.build_artifact_id }}
          BOOTSTRAP_RUN: ${{ steps.registration.outputs.bootstrap_run_id }}
          BOOTSTRAP_ARTIFACT: ${{ steps.registration.outputs.bootstrap_artifact_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > "$RUNNER_TEMP/wealth-build-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs?per_page=100" > "$RUNNER_TEMP/wealth-build-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BUILD_ARTIFACT" > "$RUNNER_TEMP/wealth-build-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOOTSTRAP_RUN" > "$RUNNER_TEMP/wealth-bootstrap-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOOTSTRAP_RUN/jobs?per_page=100" > "$RUNNER_TEMP/wealth-bootstrap-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BOOTSTRAP_ARTIFACT" > "$RUNNER_TEMP/wealth-bootstrap-artifact.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          for role in ('build', 'bootstrap'):
              rows = {}
              for key in ('run', 'jobs', 'artifact'):
                  with (root / ('wealth-' + role + '-' + key + '.json')).open('rb') as stream:
                      raw = stream.read(2 * 1024**2 + 1)
                  if len(raw) > 2 * 1024**2:
                      raise SystemExit('bounded publication metadata exceeded')
                  rows[key] = json.loads(raw)
              (root / ('wealth-' + role + '-publication.json')).write_text(json.dumps(rows))
          PY
          python control/scripts/wealth_floor_production_primer.py --validate-publication

      - name: Stage exact completed build payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.registration.outputs.build_artifact_id }}
          run-id: ${{ steps.registration.outputs.build_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/wealth-build-input
          merge-multiple: true

      - name: Stage sealed926 bootstrap authority only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.registration.outputs.bootstrap_artifact_id }}
          run-id: ${{ steps.registration.outputs.bootstrap_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/wealth-bootstrap-input
          merge-multiple: true

      - name: Install exact package manager
        shell: bash
        run: python -m pip install uv==0.13.6

      - name: Complete guarded pure preflight in a fresh no-native control env
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/wealth-primer-control-env
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          CHRONICLER_OFFLINE_GUARD_REPORT: ${{ runner.temp }}/wealth-primer-contracts/guard.json
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/wealth-primer-contracts"
          uv sync --project "$GITHUB_WORKSPACE/control" --frozen --no-install-project --python "$(command -v python)"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -I -B - <<'PY'
          import importlib.metadata, importlib.util
          if importlib.util.find_spec('chronicler_agents') is not None:
              raise SystemExit('control environment contains native extension package')
          try:
              importlib.metadata.distribution('chronicler-agents')
          except importlib.metadata.PackageNotFoundError:
              pass
          else:
              raise SystemExit('control environment contains native distribution')
          PY
          export PYTHONPATH="$GITHUB_WORKSPACE/control/src:$GITHUB_WORKSPACE/control:$GITHUB_WORKSPACE/control/scripts/testing"
          timeout 110s "$UV_PROJECT_ENVIRONMENT/bin/python" -B -m pytest -q \
            "$GITHUB_WORKSPACE/control/tests/test_wealth_floor_candidate_proof.py" \
            "$GITHUB_WORKSPACE/control/tests/test_wealth_floor_production_primer.py" \
            -p python_oracle_guard -p no:cacheprovider \
            --basetemp="$RUNNER_TEMP/wealth-primer-contract-fixtures" \
            --junitxml="$RUNNER_TEMP/wealth-primer-contracts/junit.xml" \
            2>&1 | tee "$RUNNER_TEMP/wealth-primer-contracts/pytest.log"

      - name: Run fixed late checkpoints and production-runtime repeats
        shell: bash
        run: |
          set -euo pipefail
          python control/scripts/wealth_floor_production_primer.py --execute \
            --source "$GITHUB_WORKSPACE/candidate" \
            --output "$RUNNER_TEMP/wealth-production-primer"

      - name: Retain bounded pending proof authority
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wealth-production-primer-light-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wealth-production-primer/publication/
          if-no-files-found: warn
          retention-days: 30

      - name: Retain pure preflight outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wealth-production-primer-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wealth-primer-contracts/
          if-no-files-found: warn
          retention-days: 30

      - name: Retain genuine candidate-owned physical outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wealth-production-primer-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wealth-production-primer/payload/
            ${{ runner.temp }}/wealth-production-primer/logs/
            ${{ runner.temp }}/wealth-production-primer/publication/
            ${{ runner.temp }}/wealth-production-primer/progress.jsonl
            ${{ runner.temp }}/wealth-production-primer/checkpoint-report.json
            ${{ runner.temp }}/wealth-production-primer/template-runtime.json
            ${{ runner.temp }}/wealth-production-primer/procedural-runtime.json
            ${{ runner.temp }}/wealth-production-primer/control-sources-before.json
            ${{ runner.temp }}/wealth-production-primer/control-sources-after.json
            ${{ runner.temp }}/wealth-production-primer/control-git-before.json
            ${{ runner.temp }}/wealth-production-primer/control-git-after.json
            ${{ runner.temp }}/wealth-production-primer/candidate-source-before.json
            ${{ runner.temp }}/wealth-production-primer/candidate-source-after.json
            ${{ runner.temp }}/wealth-production-primer/candidate-probe.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

# No old checkpoints, baseline installation/worlds, compiler, threshold changes,
# retries, scratch deletion, outcome-cohort launcher or final A proof activation.
# Original scratch/staged inputs remain to runner teardown. Bounded physical copy
# retains all late CP/resume/repeat outputs on success or best-effort after failure.
# Positive receipts remain pending exact artifact seals and completed producer review.
