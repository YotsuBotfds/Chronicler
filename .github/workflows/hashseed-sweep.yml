name: Hash-seed sweep

# The same seeded aggregate world under PYTHONHASHSEED 0, 1, 2 and random must
# give identical outputs. The sweep jobs stay disabled until COR-1 merges:
# before it, the food-goods iteration order of war_requisition.py (a frozenset)
# depends on the hash seed and the sweep is known to fail. The real-process
# batch test does not read that order and runs now.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: Determinism-off under PYTHONHASHSEED ${{ matrix.h }}
    # TODO(COR-1): remove this guard (here and on compare) once COR-1 fixes the
    # food-goods order; until then the sweep is expected to differ.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        h: ["0", "1", "2", "random"]
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies from the lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv>=0.5,<1"
          uv lock --check
          uv sync --frozen --no-dev --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run the determinism-off profile under the hash seed
        env:
          HASH_SEED: ${{ matrix.h }}
        run: |
          python scripts/m53b_run_validation.py \
            --profile determinism-off \
            --hash-seed "$HASH_SEED" \
            --output-root "output/hashseed/$HASH_SEED"

      - name: Digest the outputs
        env:
          HASH_SEED: ${{ matrix.h }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from chronicler.validation_io import SCRUB_KEYS
          seed = os.environ["HASH_SEED"]
          batch = Path("output/hashseed") / seed / "determinism_off" / "batch_42"
          def scrub(value):
              if isinstance(value, dict):
                  return {k: scrub(v) for k, v in value.items() if k not in SCRUB_KEYS}
              if isinstance(value, list):
                  return [scrub(v) for v in value]
              return value
          lines = []
          for run in ("seed_42_a", "seed_42_b"):
              state = (batch / run / "state.json").read_bytes()
              lines.append(f"{hashlib.sha256(state).hexdigest()}  {run}/state.json")
              bundle = scrub(json.loads((batch / run / "chronicle_bundle.json").read_text(encoding="utf-8")))
              canonical = json.dumps(bundle, sort_keys=True, separators=(",", ":")).encode()
              lines.append(f"{hashlib.sha256(canonical).hexdigest()}  {run}/chronicle_bundle.json (scrubbed)")
          Path("digests").mkdir(exist_ok=True)
          Path("digests/digests.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: hashseed-digests-${{ matrix.h }}
          path: digests/digests.txt
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Compare digests across hash seeds
    needs: sweep
    # TODO(COR-1): remove with the sweep's guard.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download every digest
        uses: actions/download-artifact@v4
        with:
          pattern: hashseed-digests-*
          path: digests

      - name: Require identical digests
        shell: bash
        run: |
          set -euo pipefail
          reference=digests/hashseed-digests-0/digests.txt
          status=0
          for file in digests/hashseed-digests-*/digests.txt; do
            echo "== $file"
            cat "$file"
            if ! diff -u "$reference" "$file"; then
              status=1
            fi
          done
          exit "$status"

  real-process:
    name: Real multiprocessing batch (pytest -m real_process)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies from the lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv>=0.5,<1"
          uv lock --check
          uv sync --frozen --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run the real-process tests
        run: python -m pytest -m real_process -q tests/test_batch_parallel_real.py
