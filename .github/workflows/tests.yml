name: Tests

on:
  pull_request:
  push:
    branches: [main, lead/cloud-continuation-20261028, lead/recovered-integration-20261029, lead/recovered-review-20261029, lead/batch-validation-input-set-20261029, lead/batch-manifest-reconciliation-20261029]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-offline:
    name: Python bounded offline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore uv artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-py313-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ runner.arch }}-py313-

      - name: Install Python dependencies from the lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv>=0.5,<1"
          uv lock --check
          uv sync --frozen --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Assert native extension is absent
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.find_spec("chronicler_agents")
          if spec is not None:
              raise SystemExit(f"offline lane unexpectedly sees chronicler_agents at {spec.origin}")
          PY

      - name: Run guarded offline chunks
        run: python scripts/run_python_oracle_checks.py --output-dir "$RUNNER_TEMP/chronicler-oracle-evidence"

      - name: Retain bounded offline receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-offline-${{ github.sha }}
          path: |
            ${{ runner.temp }}/chronicler-oracle-evidence/receipt.json
            ${{ runner.temp }}/chronicler-oracle-evidence/guard-*.json
            ${{ runner.temp }}/chronicler-oracle-evidence/pytest-*.txt
          if-no-files-found: warn
          retention-days: 14

  python-no-rust:
    name: Python no-Rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore uv artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-py313-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ runner.arch }}-py313-

      - name: Install Python dependencies from the lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv>=0.5,<1"
          uv lock --check
          uv sync --frozen --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Assert native extension is absent
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.find_spec("chronicler_agents")
          if spec is not None:
              raise SystemExit(f"no-Rust lane unexpectedly sees chronicler_agents at {spec.origin}")
          PY

      - name: Check turn-wrapper contracts before the full suite
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: src:.:scripts/testing
          CHRONICLER_OFFLINE_GUARD_REPORT: ${{ runner.temp }}/chronicler-wrapper-preflight/guard.json
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/chronicler-wrapper-preflight"
          timeout --signal=KILL 110s python -B -m pytest -q --tb=short \
            tests/test_practice_growth_observer.py::test_turn_wrappers_share_signature_and_forward_only_explicit_trace \
            tests/test_turn_artifact_lifecycle.py::test_result_wrapper_preserves_signature_and_arguments \
            -p python_oracle_guard -p no:cacheprovider \
            --basetemp="$RUNNER_TEMP/chronicler-wrapper-preflight/pytest" \
            --junitxml="$RUNNER_TEMP/chronicler-wrapper-preflight/junit.xml" \
            2>&1 | tee "$RUNNER_TEMP/chronicler-wrapper-preflight/pytest.log"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          guard = json.loads(Path(os.environ["CHRONICLER_OFFLINE_GUARD_REPORT"]).read_text())
          expected = {
              "state": "PASS",
              "guard_active_at_finish": True,
              "runtime_factories_replaced_before_collection": True,
              "pytest_exitstatus": 0,
              "test_reports": {"passed": 2, "failed": 0, "skipped": 0},
              "native_modules_loaded": [],
              "native_import_attempts_blocked": [],
              "blocked_io_attempts": [],
              "python_oracle_factory_calls": {"ecology": 0, "politics": 0},
          }
          if any(guard.get(key) != value for key, value in expected.items()):
              raise SystemExit("turn-wrapper preflight guard evidence is incomplete or unexpected")
          PY

      - name: Retain no-Rust turn-wrapper preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-contract-no-rust-${{ github.sha }}
          path: |
            ${{ runner.temp }}/chronicler-wrapper-preflight/guard.json
            ${{ runner.temp }}/chronicler-wrapper-preflight/pytest.log
            ${{ runner.temp }}/chronicler-wrapper-preflight/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Run Python tests without Rust extension
        run: python -m pytest -q --junitxml=ci-evidence/no-rust.xml

      - name: Retain no-Rust test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-no-rust-${{ github.sha }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 14

  python-native-tests:
    name: Python native execution
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore uv artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-py313-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ runner.arch }}-py313-

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Identify Rust compiler
        id: compiler
        shell: bash
        run: echo "digest=$(rustc --version --verbose | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('chronicler-agents/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore release build cache
        uses: actions/cache@v4
        with:
          path: chronicler-agents/target/release
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-py313-${{ steps.compiler.outputs.digest }}-${{ hashFiles('chronicler-agents/Cargo.lock', 'chronicler-agents/Cargo.toml') }}-${{ github.sha }}
          restore-keys: cargo-release-${{ runner.os }}-${{ runner.arch }}-py313-${{ steps.compiler.outputs.digest }}-${{ hashFiles('chronicler-agents/Cargo.lock', 'chronicler-agents/Cargo.toml') }}-

      - name: Install Python dependencies from the lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv>=0.5,<1"
          uv lock --check
          uv sync --frozen --python "$(command -v python)"
          uv pip install --python .venv/bin/python "maturin>=1.5,<2"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check turn-wrapper contracts before the full suite
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: src:.:scripts/testing
          CHRONICLER_OFFLINE_GUARD_REPORT: ${{ runner.temp }}/chronicler-wrapper-preflight/guard.json
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/chronicler-wrapper-preflight"
          timeout --signal=KILL 110s python -B -m pytest -q --tb=short \
            tests/test_practice_growth_observer.py::test_turn_wrappers_share_signature_and_forward_only_explicit_trace \
            tests/test_turn_artifact_lifecycle.py::test_result_wrapper_preserves_signature_and_arguments \
            -p python_oracle_guard -p no:cacheprovider \
            --basetemp="$RUNNER_TEMP/chronicler-wrapper-preflight/pytest" \
            --junitxml="$RUNNER_TEMP/chronicler-wrapper-preflight/junit.xml" \
            2>&1 | tee "$RUNNER_TEMP/chronicler-wrapper-preflight/pytest.log"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          guard = json.loads(Path(os.environ["CHRONICLER_OFFLINE_GUARD_REPORT"]).read_text())
          expected = {
              "state": "PASS",
              "guard_active_at_finish": True,
              "runtime_factories_replaced_before_collection": True,
              "pytest_exitstatus": 0,
              "test_reports": {"passed": 2, "failed": 0, "skipped": 0},
              "native_modules_loaded": [],
              "native_import_attempts_blocked": [],
              "blocked_io_attempts": [],
              "python_oracle_factory_calls": {"ecology": 0, "politics": 0},
          }
          if any(guard.get(key) != value for key, value in expected.items()):
              raise SystemExit("turn-wrapper preflight guard evidence is incomplete or unexpected")
          PY

      - name: Retain native turn-wrapper preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-contract-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/chronicler-wrapper-preflight/guard.json
            ${{ runner.temp }}/chronicler-wrapper-preflight/pytest.log
            ${{ runner.temp }}/chronicler-wrapper-preflight/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Build Rust extension wheel
        run: |
          cd chronicler-agents
          python -m maturin build --release --locked
          uv pip install --python ../.venv/bin/python target/wheels/*.whl

      - name: Run Python tests with real native extension preloaded
        run: |
          python - <<'PY'
          from importlib import util
          from importlib.machinery import EXTENSION_SUFFIXES
          import hashlib
          import json
          import os
          from pathlib import Path
          import runpy
          import sys
          import chronicler_agents as ca
          import pytest

          spec = util.find_spec("chronicler_agents.chronicler_agents")
          origin = spec.origin if spec else ""
          if not origin.endswith(tuple(EXTENSION_SUFFIXES)):
              raise SystemExit(f"chronicler_agents native submodule is not a compiled extension: {origin!r}")

          for name in ("AgentSimulator", "EcologySimulator", "PoliticsSimulator"):
              cls = getattr(ca, name, None)
              if not isinstance(cls, type):
                  raise SystemExit(f"{name} is not a real native class: {cls!r}")

          evidence = Path("ci-evidence")
          evidence.mkdir(exist_ok=True)
          (evidence / "native-identity.json").write_text(json.dumps({
              "source_commit": os.environ["GITHUB_SHA"],
              "python": sys.version,
              "executable": sys.executable,
              "compiled_extension": origin,
              "sha256": hashlib.sha256(Path(origin).read_bytes()).hexdigest(),
              "classes": ["AgentSimulator", "EcologySimulator", "PoliticsSimulator"],
          }, indent=2) + "\n", encoding="utf-8")
          # Retain this exact wheel for later inspection or explicitly qualified reuse.
          # Its native member must match the compiled module already checked above.
          record_wheel = runpy.run_path("scripts/native_wheel_receipt.py")["wheel_receipt"]
          build_receipt = record_wheel(Path("chronicler-agents/target/wheels"), Path(origin), os.environ["GITHUB_SHA"])
          build_receipt["python"] = sys.version
          build_receipt["classes"] = ["AgentSimulator", "EcologySimulator", "PoliticsSimulator"]
          wheel_evidence = Path("ci-native-wheel")
          wheel_evidence.mkdir(exist_ok=True)
          (wheel_evidence / "manifest.json").write_text(json.dumps(build_receipt, indent=2) + "\n", encoding="utf-8")
          raise SystemExit(pytest.main(["-q", "--junitxml=ci-evidence/native.xml"]))
          PY

      - name: Retain native Python test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-native-${{ github.sha }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain the identified native wheel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-wheel-${{ github.sha }}
          path: |
            ci-native-wheel/manifest.json
            chronicler-agents/target/wheels/*.whl
          if-no-files-found: warn
          retention-days: 14

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Qualified separately at d051: full tests, assertions and overflow checks.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for PyO3 test linkage
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('chronicler-agents/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Run Rust tests
        shell: bash
        run: |
          mkdir -p ci-evidence
          export PYO3_PYTHON="$(command -v python)"
          cargo test --locked --manifest-path chronicler-agents/Cargo.toml --quiet 2>&1 | tee ci-evidence/rust.txt

      - name: Retain Rust test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-${{ github.sha }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 14

  python-native:
    name: Python native
    if: always()
    needs: [python-native-tests, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete native Python and Rust success
        env:
          PYTHON_RESULT: ${{ needs.python-native-tests.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        shell: bash
        run: |
          test "$PYTHON_RESULT" = success
          test "$RUST_RESULT" = success

  viewer:
    name: Viewer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: viewer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install viewer dependencies from the lockfile
        run: npm ci

      - name: Run viewer tests
        run: npm test -- --maxWorkers=2

      - name: Lint viewer
        run: npm run lint

      - name: Build viewer for production
        run: npm run build
