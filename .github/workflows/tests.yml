name: Tests

on:
  pull_request:
  push:
    branches: [main, lead/cloud-continuation-20261028, lead/recovered-integration-20261029, lead/recovered-review-20261029, lead/batch-validation-input-set-20261029, lead/batch-manifest-reconciliation-20261029]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-offline:
    name: Python bounded offline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore uv artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-py313-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ runner.arch }}-py313-

      - name: Install Python dependencies from the lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv>=0.5,<1"
          uv lock --check
          uv sync --frozen --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Assert native extension is absent
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.find_spec("chronicler_agents")
          if spec is not None:
              raise SystemExit(f"offline lane unexpectedly sees chronicler_agents at {spec.origin}")
          PY

      - name: Run guarded offline chunks
        run: python scripts/run_python_oracle_checks.py --output-dir "$RUNNER_TEMP/chronicler-oracle-evidence"

      - name: Retain bounded offline receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-offline-${{ github.sha }}
          path: |
            ${{ runner.temp }}/chronicler-oracle-evidence/receipt.json
            ${{ runner.temp }}/chronicler-oracle-evidence/guard-*.json
            ${{ runner.temp }}/chronicler-oracle-evidence/pytest-*.txt
          if-no-files-found: warn
          retention-days: 14

  python-no-rust:
    name: Python no-Rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore uv artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-py313-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ runner.arch }}-py313-

      - name: Install Python dependencies from the lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv>=0.5,<1"
          uv lock --check
          uv sync --frozen --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Assert native extension is absent
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.find_spec("chronicler_agents")
          if spec is not None:
              raise SystemExit(f"no-Rust lane unexpectedly sees chronicler_agents at {spec.origin}")
          PY

      - name: Check turn-wrapper contracts before the full suite
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: src:.:scripts/testing
          CHRONICLER_OFFLINE_GUARD_REPORT: ${{ runner.temp }}/chronicler-wrapper-preflight/guard.json
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/chronicler-wrapper-preflight"
          timeout --signal=KILL 110s python -B -m pytest -q --tb=short \
            tests/test_practice_growth_observer.py::test_turn_wrappers_share_signature_and_forward_only_explicit_trace \
            tests/test_turn_artifact_lifecycle.py::test_result_wrapper_preserves_signature_and_arguments \
            -p python_oracle_guard -p no:cacheprovider \
            --basetemp="$RUNNER_TEMP/chronicler-wrapper-preflight/pytest" \
            --junitxml="$RUNNER_TEMP/chronicler-wrapper-preflight/junit.xml" \
            2>&1 | tee "$RUNNER_TEMP/chronicler-wrapper-preflight/pytest.log"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          guard = json.loads(Path(os.environ["CHRONICLER_OFFLINE_GUARD_REPORT"]).read_text())
          expected = {
              "state": "PASS",
              "guard_active_at_finish": True,
              "runtime_factories_replaced_before_collection": True,
              "pytest_exitstatus": 0,
              "test_reports": {"passed": 2, "failed": 0, "skipped": 0},
              "native_modules_loaded": [],
              "native_import_attempts_blocked": [],
              "blocked_io_attempts": [],
              "python_oracle_factory_calls": {"ecology": 0, "politics": 0},
          }
          if any(guard.get(key) != value for key, value in expected.items()):
              raise SystemExit("turn-wrapper preflight guard evidence is incomplete or unexpected")
          PY

      - name: Retain no-Rust turn-wrapper preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-contract-no-rust-${{ github.sha }}
          path: |
            ${{ runner.temp }}/chronicler-wrapper-preflight/guard.json
            ${{ runner.temp }}/chronicler-wrapper-preflight/pytest.log
            ${{ runner.temp }}/chronicler-wrapper-preflight/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Run Python tests without Rust extension
        run: python -m pytest -q --junitxml=ci-evidence/no-rust.xml

      - name: Retain no-Rust test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-no-rust-${{ github.sha }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 14

  python-native-build:
    name: Build one current-source native wheel
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      # NATIVE_RELEASE_CACHE_DEFAULT_BEGIN
      CHRONICLER_NATIVE_RELEASE_CACHE: "0"
      # NATIVE_RELEASE_CACHE_DEFAULT_END
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore uv artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-py313-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ runner.arch }}-py313-

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Identify Rust compiler
        id: compiler
        shell: bash
        run: echo "digest=$(rustc --version --verbose | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('chronicler-agents/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore release build cache
        # NATIVE_RELEASE_CACHE_OLD_RESTORE_BEGIN
        if: env.CHRONICLER_NATIVE_RELEASE_CACHE != '1'
        # NATIVE_RELEASE_CACHE_OLD_RESTORE_END
        uses: actions/cache@v4
        with:
          path: chronicler-agents/target/release
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-py313-${{ steps.compiler.outputs.digest }}-${{ hashFiles('chronicler-agents/Cargo.lock', 'chronicler-agents/Cargo.toml') }}-${{ github.sha }}
          restore-keys: cargo-release-${{ runner.os }}-${{ runner.arch }}-py313-${{ steps.compiler.outputs.digest }}-${{ hashFiles('chronicler-agents/Cargo.lock', 'chronicler-agents/Cargo.toml') }}-

      - name: Install Python dependencies from the lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv>=0.5,<1"
          uv lock --check
          uv sync --frozen --python "$(command -v python)"
          uv pip install --python .venv/bin/python "maturin>=1.5,<2"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # NATIVE_RELEASE_CACHE_PREPARE_BEGIN
      - name: Prepare dormant exact native cache context
        if: env.CHRONICLER_NATIVE_RELEASE_CACHE == '1'
        id: native_cache_context
        run: python scripts/native_release_cache.py prepare --root "$PWD" --prepared "$RUNNER_TEMP/native-cache-prepared.json" --output "$RUNNER_TEMP/native-cache-prepare.json" --github-output "$GITHUB_OUTPUT"

      - name: Restore dormant exact native cache
        if: env.CHRONICLER_NATIVE_RELEASE_CACHE == '1' && steps.native_cache_context.outputs.eligible == 'true'
        id: native_cache_restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            chronicler-agents/target/release
            chronicler-agents/target/native-release-cache-v1.json
          key: ${{ steps.native_cache_context.outputs.key }}

      - name: Admit dormant native cache timestamps
        if: env.CHRONICLER_NATIVE_RELEASE_CACHE == '1' && steps.native_cache_context.outputs.eligible == 'true'
        env:
          NATIVE_CACHE_MATCHED_KEY: ${{ steps.native_cache_restore.outputs.cache-matched-key }}
          NATIVE_CACHE_EXACT_HIT: ${{ steps.native_cache_restore.outputs.cache-hit }}
        run: python scripts/native_release_cache.py admit --root "$PWD" --prepared "$RUNNER_TEMP/native-cache-prepared.json" --output "$RUNNER_TEMP/native-cache-admit.json" --matched-key "$NATIVE_CACHE_MATCHED_KEY" --exact-hit "$NATIVE_CACHE_EXACT_HIT"
      # NATIVE_RELEASE_CACHE_PREPARE_END

      - name: Admit complete fixed module assignment before build
        run: python scripts/native_ci_shards.py check-manifest --execute --output "$RUNNER_TEMP/native-module-admission.json"

      - name: Check turn-wrapper contracts before the full suite
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: src:.:scripts/testing
          CHRONICLER_OFFLINE_GUARD_REPORT: ${{ runner.temp }}/chronicler-wrapper-preflight/guard.json
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/chronicler-wrapper-preflight"
          timeout --signal=KILL 110s python -B -m pytest -q --tb=short \
            tests/test_practice_growth_observer.py::test_turn_wrappers_share_signature_and_forward_only_explicit_trace \
            tests/test_turn_artifact_lifecycle.py::test_result_wrapper_preserves_signature_and_arguments \
            -p python_oracle_guard -p no:cacheprovider \
            --basetemp="$RUNNER_TEMP/chronicler-wrapper-preflight/pytest" \
            --junitxml="$RUNNER_TEMP/chronicler-wrapper-preflight/junit.xml" \
            2>&1 | tee "$RUNNER_TEMP/chronicler-wrapper-preflight/pytest.log"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          guard = json.loads(Path(os.environ["CHRONICLER_OFFLINE_GUARD_REPORT"]).read_text())
          expected = {
              "state": "PASS",
              "guard_active_at_finish": True,
              "runtime_factories_replaced_before_collection": True,
              "pytest_exitstatus": 0,
              "test_reports": {"passed": 2, "failed": 0, "skipped": 0},
              "native_modules_loaded": [],
              "native_import_attempts_blocked": [],
              "blocked_io_attempts": [],
              "python_oracle_factory_calls": {"ecology": 0, "politics": 0},
          }
          if any(guard.get(key) != value for key, value in expected.items()):
              raise SystemExit("turn-wrapper preflight guard evidence is incomplete or unexpected")
          PY

      - name: Retain native turn-wrapper preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-contract-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/chronicler-wrapper-preflight/guard.json
            ${{ runner.temp }}/chronicler-wrapper-preflight/pytest.log
            ${{ runner.temp }}/chronicler-wrapper-preflight/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Build Rust extension wheel
        run: |
          cd chronicler-agents
          python -m maturin build --release --locked
          uv pip install --python ../.venv/bin/python target/wheels/*.whl

      - name: Record the verified current-producer native wheel
        run: python scripts/native_ci_shards.py record-build --execute --wheel-dir chronicler-agents/target/wheels --output ci-native-wheel/build.json

      # NATIVE_RELEASE_CACHE_SEAL_BEGIN
      - name: Seal dormant native cache after current build receipt
        if: env.CHRONICLER_NATIVE_RELEASE_CACHE == '1' && steps.native_cache_context.outputs.eligible == 'true'
        id: native_cache_seal
        run: python scripts/native_release_cache.py seal --root "$PWD" --prepared "$RUNNER_TEMP/native-cache-prepared.json" --output "$RUNNER_TEMP/native-cache-seal.json" --build-record ci-native-wheel/build.json --github-output "$GITHUB_OUTPUT"

      - name: Save dormant sealed native cache
        if: env.CHRONICLER_NATIVE_RELEASE_CACHE == '1' && steps.native_cache_seal.outputs.eligible == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            chronicler-agents/target/release
            chronicler-agents/target/native-release-cache-v1.json
          key: ${{ steps.native_cache_context.outputs.key }}
      # NATIVE_RELEASE_CACHE_SEAL_END

      - name: Retain this run's verified builder wheel and context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-shard-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-native-wheel/build.json
            chronicler-agents/target/wheels/*.whl
          if-no-files-found: error
          retention-days: 14

  python-native-tests:
    name: Python native module shard ${{ matrix.shard }}
    needs: [python-native-build]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ['0', '1']
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create private directories before Python starts
        shell: bash
        run: |
          private_root="$RUNNER_TEMP/native-shard-${{ matrix.shard }}"
          mkdir -p "$private_root/tmp" "$private_root/pd" "$private_root/r007" "$private_root/q009"
          {
            echo "TMPDIR=$private_root/tmp"
            echo "PD_EVIDENCE_DIR=$private_root/pd"
            echo "R007_EVIDENCE_DIR=$private_root/r007"
            echo "Q009_EVIDENCE_DIR=$private_root/q009"
          } >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install identical lockfile dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv>=0.5,<1"
          uv lock --check
          uv sync --frozen --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Download only this run's successful builder wheel
        uses: actions/download-artifact@v4
        with:
          name: native-shard-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-shard-build

      - name: Verify source producer and whole wheel before install
        run: python scripts/native_ci_shards.py verify-transfer --execute --build "$RUNNER_TEMP/native-shard-build/ci-native-wheel/build.json" --wheel-dir "$RUNNER_TEMP/native-shard-build/chronicler-agents/target/wheels" --output "$RUNNER_TEMP/native-shard-${{ matrix.shard }}/transfer.json"

      - name: Install the same verified current-source wheel
        run: uv pip install --python .venv/bin/python "$RUNNER_TEMP"/native-shard-build/chronicler-agents/target/wheels/*.whl

      - name: Full default collection then owned module execution
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/native_ci_shards.py run --execute --shard "${{ matrix.shard }}" --build "$RUNNER_TEMP/native-shard-build/ci-native-wheel/build.json" --wheel-dir "$RUNNER_TEMP/native-shard-build/chronicler-agents/target/wheels" --output "$RUNNER_TEMP/native-shard-${{ matrix.shard }}" 2>&1 | tee "$RUNNER_TEMP/native-shard-${{ matrix.shard }}/pytest.log"

      - name: Retain every shard's first result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-module-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-shard-${{ matrix.shard }}/transfer.json
            ${{ runner.temp }}/native-shard-${{ matrix.shard }}/receipt.json
            ${{ runner.temp }}/native-shard-${{ matrix.shard }}/native.xml
            ${{ runner.temp }}/native-shard-${{ matrix.shard }}/pytest.log
          if-no-files-found: error
          retention-days: 14

  python-native-shard-aggregate:
    name: Python native execution
    if: always()
    needs: [python-native-build, python-native-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require builder and both matrix children success
        env:
          BUILD_RESULT: ${{ needs.python-native-build.result }}
          SHARD_RESULT: ${{ needs.python-native-tests.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$SHARD_RESULT" = success

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked metadata reader dependencies
        run: |
          python -m pip install "uv>=0.5,<1"
          uv sync --frozen --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Download same-run builder
        uses: actions/download-artifact@v4
        with:
          name: native-shard-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-shard-aggregate/native-shard-build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download same-run shard zero
        uses: actions/download-artifact@v4
        with:
          name: native-module-shard-0-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-shard-aggregate/native-module-shard-0-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download same-run shard one
        uses: actions/download-artifact@v4
        with:
          name: native-module-shard-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-shard-aggregate/native-module-shard-1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify exact-once parent and subtest ownership
        run: |
          python scripts/native_ci_shards.py aggregate --execute --build "$RUNNER_TEMP/native-shard-aggregate/native-shard-build-${{ github.run_id }}-${{ github.run_attempt }}/ci-native-wheel/build.json" --receipts "$RUNNER_TEMP/native-shard-aggregate/native-module-shard-0-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json" "$RUNNER_TEMP/native-shard-aggregate/native-module-shard-1-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json" --junits "$RUNNER_TEMP/native-shard-aggregate/native-module-shard-0-${{ github.run_id }}-${{ github.run_attempt }}/native.xml" "$RUNNER_TEMP/native-shard-aggregate/native-module-shard-1-${{ github.run_id }}-${{ github.run_attempt }}/native.xml" --output "$RUNNER_TEMP/native-shard-aggregate/aggregate.json"

      - name: Retain aggregate decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-module-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-shard-aggregate/aggregate.json
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Qualified separately at d051: full tests, assertions and overflow checks.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for PyO3 test linkage
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('chronicler-agents/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Run Rust tests
        shell: bash
        run: |
          mkdir -p ci-evidence
          export PYO3_PYTHON="$(command -v python)"
          cargo test --locked --manifest-path chronicler-agents/Cargo.toml --quiet 2>&1 | tee ci-evidence/rust.txt

      - name: Retain Rust test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-${{ github.sha }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 14

  python-native:
    name: Python native
    if: always()
    needs: [python-native-shard-aggregate, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete native Python and Rust success
        env:
          PYTHON_RESULT: ${{ needs.python-native-shard-aggregate.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        shell: bash
        run: |
          test "$PYTHON_RESULT" = success
          test "$RUST_RESULT" = success

  viewer:
    name: Viewer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: viewer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install viewer dependencies from the lockfile
        run: npm ci

      - name: Run viewer tests
        run: npm test -- --maxWorkers=2

      - name: Lint viewer
        run: npm run lint

      - name: Build viewer for production
        run: npm run build
