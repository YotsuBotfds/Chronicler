name: Paired context API benchmark

# Source publication is inert; this exact run-ref push is a separate action.
on:
  push:
    branches: [lead/paired-context-benchmark-run-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    if: github.ref == 'refs/heads/lead/paired-context-benchmark-run-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      RAYON_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out controller
        uses: actions/checkout@v4
        with:
          path: controller
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check out exact parent
        uses: actions/checkout@v4
        with:
          ref: 82902b85a94ebb008168cb06195b031c6ee1eb92
          path: measured-parent
      - name: Check out exact child
        uses: actions/checkout@v4
        with:
          ref: ef716e7f0d5ba0fa1e4c53774389201bcc23720d
          path: measured-child
      - name: Admit source identities and fresh private paths
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/lead/paired-context-benchmark-run-20261030
          test "$(git -C controller rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C measured-parent rev-parse HEAD)" = 82902b85a94ebb008168cb06195b031c6ee1eb92
          test "$(git -C measured-child rev-parse HEAD)" = ef716e7f0d5ba0fa1e4c53774389201bcc23720d
          test "$(git -C measured-parent rev-parse HEAD:chronicler-agents)" = a840fd12462deedf92b256878d474404eeac892d
          test "$(git -C measured-child rev-parse HEAD:chronicler-agents)" = 8e3ec0e90e184bcb9f11d6bd21eb5d275e7bf9db
          cmp measured-parent/uv.lock measured-child/uv.lock
          cmp measured-parent/chronicler-agents/Cargo.lock measured-child/chronicler-agents/Cargo.lock
          for role in parent child; do
            test ! -e "$RUNNER_TEMP/paired-context-target-$role"
            test ! -e "$RUNNER_TEMP/paired-context-venv-$role"
          done
          test ! -e "$RUNNER_TEMP/paired-context-builder"
          mkdir "$RUNNER_TEMP/paired-context-evidence" "$RUNNER_TEMP/paired-context-wheels"
          mkdir "$RUNNER_TEMP/paired-context-evidence/build" "$RUNNER_TEMP/paired-context-wheels/parent" "$RUNNER_TEMP/paired-context-wheels/child"
          printf 'PAIR_EVIDENCE_ROOT=%s\nPAIR_WHEEL_ROOT=%s\n' "$RUNNER_TEMP/paired-context-evidence" "$RUNNER_TEMP/paired-context-wheels" >> "$GITHUB_ENV"
          printf 'PYTHONPATH=%s\n' "$GITHUB_WORKSPACE/controller" >> "$GITHUB_ENV"
          python -B controller/scripts/paired_context_benchmark.py --plan-only --output "$RUNNER_TEMP/paired-context-evidence/plan.json"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install one builder and both frozen role environments
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "uv>=0.5,<1"
          python -m venv "$RUNNER_TEMP/paired-context-builder"
          uv pip install --python "$RUNNER_TEMP/paired-context-builder/bin/python" "maturin>=1.5,<2"
          for role in parent child; do
            uv lock --check --project "$GITHUB_WORKSPACE/measured-$role"
            UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/paired-context-venv-$role" uv sync --frozen --project "$GITHUB_WORKSPACE/measured-$role" --python "$(command -v python)"
          done
          rustc --version --verbose > "$PAIR_EVIDENCE_ROOT/build/rustc.txt"
          cargo --version > "$PAIR_EVIDENCE_ROOT/build/cargo.txt"
          "$RUNNER_TEMP/paired-context-builder/bin/python" -m maturin --version > "$PAIR_EVIDENCE_ROOT/build/maturin.txt"
          uv --version > "$PAIR_EVIDENCE_ROOT/build/uv.txt"
      - name: Build and install the parent's own locked release wheel
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/paired-context-target-parent" "$RUNNER_TEMP/paired-context-builder/bin/python" -m maturin build --release --locked \
            --manifest-path "$GITHUB_WORKSPACE/measured-parent/chronicler-agents/Cargo.toml" \
            --interpreter "$RUNNER_TEMP/paired-context-venv-parent/bin/python" --out "$PAIR_WHEEL_ROOT/parent"
          uv pip install --python "$RUNNER_TEMP/paired-context-venv-parent/bin/python" "$PAIR_WHEEL_ROOT/parent/"*.whl
      - name: Record parent source, wheel and real compiled exports
        id: parent_identity
        run: >-
          CARGO_TARGET_DIR="$RUNNER_TEMP/paired-context-target-parent" "$RUNNER_TEMP/paired-context-venv-parent/bin/python" -B controller/scripts/paired_context_benchmark.py
          --record-measured-build --controller-root "$GITHUB_WORKSPACE/controller"
          --measured-root "$GITHUB_WORKSPACE/measured-parent" --role parent
          --wheel-dir "$PAIR_WHEEL_ROOT/parent" --build "$PAIR_EVIDENCE_ROOT/build/parent.json"
      - name: Build and install the child's own locked release wheel
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/paired-context-target-child" "$RUNNER_TEMP/paired-context-builder/bin/python" -m maturin build --release --locked \
            --manifest-path "$GITHUB_WORKSPACE/measured-child/chronicler-agents/Cargo.toml" \
            --interpreter "$RUNNER_TEMP/paired-context-venv-child/bin/python" --out "$PAIR_WHEEL_ROOT/child"
          uv pip install --python "$RUNNER_TEMP/paired-context-venv-child/bin/python" "$PAIR_WHEEL_ROOT/child/"*.whl
      - name: Record child source, wheel and real compiled exports
        id: child_identity
        run: >-
          CARGO_TARGET_DIR="$RUNNER_TEMP/paired-context-target-child" "$RUNNER_TEMP/paired-context-venv-child/bin/python" -B controller/scripts/paired_context_benchmark.py
          --record-measured-build --controller-root "$GITHUB_WORKSPACE/controller"
          --measured-root "$GITHUB_WORKSPACE/measured-child" --role child
          --wheel-dir "$PAIR_WHEEL_ROOT/child" --build "$PAIR_EVIDENCE_ROOT/build/child.json"
      - name: Run one jointly bounded serial comparison
        id: comparison
        shell: bash
        run: |
          set -uo pipefail
          set +e
          pair_cpu="$(python -c 'import os; print(min(os.sched_getaffinity(0)))')"
          (
            ulimit -v 2097152
            ulimit -t 540
            exec timeout --signal=KILL 600s taskset -c "$pair_cpu" \
              python -B controller/scripts/paired_context_benchmark.py --controller \
              --parent-build "$PAIR_EVIDENCE_ROOT/build/parent.json" \
              --child-build "$PAIR_EVIDENCE_ROOT/build/child.json" --output "$PAIR_EVIDENCE_ROOT/comparison"
          )
          pair_exit=$?
          echo "exit_code=$pair_exit" >> "$GITHUB_OUTPUT"
          exit "$pair_exit"
      - name: Inventory all bounded evidence, including failures
        id: inventory
        if: always()
        shell: bash
        env:
          PAIRED_COMPARISON_EXIT: ${{ steps.comparison.outputs.exit_code }}
          PAIRED_PARENT_IDENTITY_OUTCOME: ${{ steps.parent_identity.outcome }}
          PAIRED_CHILD_IDENTITY_OUTCOME: ${{ steps.child_identity.outcome }}
        run: |
          pair_evidence="${PAIR_EVIDENCE_ROOT:-$RUNNER_TEMP/paired-context-evidence}"
          pair_wheels="${PAIR_WHEEL_ROOT:-$RUNNER_TEMP/paired-context-wheels}"
          if test -f controller/scripts/paired_context_benchmark.py; then
            python -B controller/scripts/paired_context_benchmark.py --record-owner --evidence-root "$pair_evidence" --wheel-root "$pair_wheels"
          else
            mkdir -p "$pair_evidence"
            python -B - "$pair_evidence/owner.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          value = dict(kind="PAIRED_CONTEXT_OWNER_UNAVAILABLE", source=os.environ["GITHUB_SHA"],
              ref=os.environ["GITHUB_REF"], run_id=os.environ["GITHUB_RUN_ID"],
              run_attempt=os.environ["GITHUB_RUN_ATTEMPT"], evidence_retention="refused",
              reason="controller checkout unavailable; no comparison success claimed")
          Path(sys.argv[1]).write_text(json.dumps(value, sort_keys=True)+"\n")
          PY
            exit 2
          fi
      - name: Publish structured evidence, including incomplete attempts
        if: always() && steps.inventory.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: paired-context-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paired-context-evidence/**
          if-no-files-found: warn
          retention-days: 14
      - name: Publish bounded owner refusal only
        if: always() && steps.inventory.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: paired-context-owner-refusal-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paired-context-evidence/owner.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish both separately identified own wheels
        if: always() && steps.parent_identity.outcome == 'success' && steps.child_identity.outcome == 'success' && steps.inventory.outputs.wheels_allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paired-context-wheels-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/paired-context-wheels/parent/*.whl
            ${{ runner.temp }}/paired-context-wheels/child/*.whl
          if-no-files-found: error
          retention-days: 14
