name: Prepared fresh practice original-byte audit

on:
  push:
    branches:
      - lead/cloud-fresh-practice-original-audit-deps-20261029
    paths:
      - .github/workflows/research-practice-original-audit.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: fresh-practice-original-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTHONHASHSEED: "0"
  PYTHON_CPU_COUNT: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  GOTO_NUM_THREADS: "1"
  RAYON_NUM_THREADS: "1"

jobs:
  original-audit:
    if: ${{ false && github.event_name == 'push' && github.ref == 'refs/heads/lead/cloud-fresh-practice-original-audit-deps-20261029' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out new audit source separately
        uses: actions/checkout@v4
        with:
          path: audit-control
          persist-credentials: false
      - name: Check out exact original study control at its historical path
        uses: actions/checkout@v4
        with:
          ref: 2d3faa8c41b4704386b246507b8606d4e3980be7
          path: control
          persist-credentials: false
      - name: Check out exact historical CBF producer separately
        uses: actions/checkout@v4
        with:
          ref: cbf6e368ebd218c1f54179bee4accffc1ab2a4c0
          path: producer
          persist-credentials: false
      - name: Set up exact Python patch without scientific packages
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.17"
      - name: Install fixed base audit prerequisites and pinned lock installer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: pytest==9.1.1 PyYAML==6.0.3 uv==0.13.6
          python - <<'PY'
          import os
          from pathlib import Path
          with Path(os.environ["GITHUB_ENV"]).open("a") as stream:
              stream.write(f"AUDIT_CPU={min(os.sched_getaffinity(0))}\n")
          PY
      - name: Prepare exclusive locked dependency environment only for guarded tests
        working-directory: audit-control
        env:
          UV_PYTHON_DOWNLOADS: never
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_BASE_PYTHON="$(command -v python)"
          test "$AUDIT_BASE_PYTHON" = "$pythonLocation/bin/python"
          test ! -e .venv
          test ! -L .venv
          UV_PROJECT_ENVIRONMENT="$PWD/.venv" "$AUDIT_BASE_PYTHON" -m uv sync \
            --frozen --no-dev --no-install-project --no-build --python "$AUDIT_BASE_PYTHON"
          "$AUDIT_BASE_PYTHON" -m uv pip install --python "$PWD/.venv/bin/python" \
            --no-build pytest==9.1.1 PyYAML==6.0.3
      - name: Check pure hostile boundary contracts without native imports
        id: pure_contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          CHRONICLER_OFFLINE_GUARD_REPORT: ${{ runner.temp }}/practice-original-contracts/guard.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/practice-original-contracts"
          export PYTHONPATH="$GITHUB_WORKSPACE/audit-control/src:$GITHUB_WORKSPACE/audit-control:$GITHUB_WORKSPACE/audit-control/scripts/testing"
          timeout --signal=KILL 110s taskset -c "$AUDIT_CPU" "$GITHUB_WORKSPACE/audit-control/.venv/bin/python" -B -m pytest -q \
            --noconftest -o pythonpath= -p python_oracle_guard -p no:cacheprovider \
            --basetemp "$RUNNER_TEMP/practice-original-contracts/pytest" \
            --junitxml="$RUNNER_TEMP/practice-original-contracts/junit.xml" \
            audit-control/tests/test_research_practice_original_audit.py
      - name: Audit only the fixed original bytes under a separate new clock
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PRACTICE_AUDIT_PURE_OUTCOME: ${{ steps.pure_contracts.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 610s taskset -c "$AUDIT_CPU" \
            python -B audit-control/scripts/audit_research_practice_original.py audit
      - name: Retain bounded new audit publication including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-practice-original-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/practice-original-audit/publication
          if-no-files-found: error
          retention-days: 30
