# DORMANT TEMPLATE. Copy these exact bytes to the registered workflow path only
# after separate source review and authorization of the closed audit activation.
name: Dormant C76 versus 95 completed artifact audit

on:
  push:
    branches: [lead/cloud-native-default-output-artifact-audit-20261029]
    paths: [.github/workflows/native-default-output-artifact-audit.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: native-default-output-artifact-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-default-output-artifact-audit:
    if: >-
      github.repository == 'YotsuBotfds/Chronicler' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lead/cloud-native-default-output-artifact-audit-20261029' &&
      github.workflow_ref == 'YotsuBotfds/Chronicler/.github/workflows/native-default-output-artifact-audit.yml@refs/heads/lead/cloud-native-default-output-artifact-audit-20261029' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONOPTIMIZE: "0"
      PYTHONHASHSEED: "0"
      OPENBLAS_THREAD_TIMEOUT: "16"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      GOTO_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      PYTHON_CPU_COUNT: "1"
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Check out only reviewed control sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /pyproject.toml
            /uv.lock
            /scripts/native_default_output_artifact_reader.py
            /scripts/native_default_output_identity_qualification.py
            /scripts/arc_output_identity_qualification.py
            /scripts/completed_export_study_reader.py
            /scripts/default_output_identity_reader.py
            /scripts/export_study_git.py
            /tests/test_native_default_output_artifact_reader.py
            /docs/experiments/native-default-output-artifact-reader-workflow.yml
      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.17"
      - name: Check small pure reader contracts
        run: python -B -m unittest discover -s control/tests -p test_native_default_output_artifact_reader.py -v
      - name: Describe inactive closed registration
        run: python -B control/scripts/native_default_output_artifact_reader.py describe
      - name: Audit only after separate source and activation review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          timeout --kill-after=5s 610s python -B control/scripts/native_default_output_artifact_reader.py audit --execute \
            --evidence "$RUNNER_TEMP/native-default-artifact-audit" \
            --prefix "$RUNNER_TEMP/native-default-artifact-reader-env"
      - name: Retain bounded complete positive or negative authority
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-default-output-artifact-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-default-artifact-audit/publication/
          if-no-files-found: error
          retention-days: 30
