# DORMANT TEMPLATE. Not installed under .github/workflows; root review must
# authorize a separate activation change. The explicit job hold is intentional.
name: Dormant C76 versus 95 default output identity

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: native-default-output-identity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-default-output-identity:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONOPTIMIZE: "0"
      PYTHONHASHSEED: "0"
      OPENBLAS_THREAD_TIMEOUT: "16"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      GOTO_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      PYTHON_CPU_COUNT: "1"
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Set external environment path
        shell: bash
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/native-default-identity-env" >> "$GITHUB_ENV"
      - name: Check out reviewed controls
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - name: Check out exact C76 source
        uses: actions/checkout@v4
        with:
          ref: c76efe8552b4c6c288ebb1f813e2c0a58e5957b1
          path: baseline
          persist-credentials: false
      - name: Check out exact qualified combined source
        uses: actions/checkout@v4
        with:
          ref: 95f73a74f809d7e10f09a1241c98014864350ffb
          path: candidate
          persist-credentials: false
      - name: Set up exact Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.17"
      - name: Check unchanged original pure contracts
        run: python -B -m unittest discover -s control/tests -p test_arc_output_identity_qualification.py -v
      - name: Check new pure adapter contracts
        run: python -B -m unittest discover -s control/tests -p test_native_default_output_identity_qualification.py -v
      - name: Create fresh locked dependency environment
        shell: bash
        run: |
          test ! -e "$UV_PROJECT_ENVIRONMENT"
          python -m pip install "uv==0.13.6"
          uv lock --project candidate --check
          uv sync --project candidate --frozen --no-dev --no-install-project --python "$(command -v python)"
      - name: Describe inactive registration
        run: python -B control/scripts/native_default_output_identity_qualification.py describe
      - name: Execute only after separate source and activation review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python -B control/scripts/native_default_output_identity_qualification.py run --execute \
            --baseline-root "$GITHUB_WORKSPACE/baseline" \
            --candidate-root "$GITHUB_WORKSPACE/candidate" \
            --python "$UV_PROJECT_ENVIRONMENT/bin/python" \
            --evidence "$RUNNER_TEMP/native-default-identity-evidence"
      - name: Retain complete positive or negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-default-output-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-default-identity-evidence/
          if-no-files-found: warn
          retention-days: 30
