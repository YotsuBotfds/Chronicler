# DORMANT TEMPLATE. Exact reviewed copy on the closed audit branch only;
# no source preparation or pure contract authorizes a transfer or audit.
name: Dormant CBF to 090 original byte audit

on:
  push:
    branches: [lead/cloud-cbf-090-default-artifact-audit-20261029]
    paths: [.github/workflows/cbf-090-default-artifact-audit.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: cbf-090-default-artifact-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cbf-090-default-artifact-audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/lead/cloud-cbf-090-default-artifact-audit-20261029' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONOPTIMIZE: "0"
      PYTHONHASHSEED: "0"
      OPENBLAS_THREAD_TIMEOUT: "16"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      GOTO_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      PYTHON_CPU_COUNT: "1"
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Select fresh external paths
        shell: bash
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/cbf-090-byte-reader-env" >> "$GITHUB_ENV"
      - name: Check out reviewed reader controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: control
          persist-credentials: false
      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.17"
      - name: Check bounded reader source contracts before any transfer
        run: python -B -m unittest discover -s control/tests -p test_cbf_090_default_artifact_reader.py -v
      - name: Describe inactive closed registration
        run: python -B control/scripts/cbf_090_default_artifact_reader.py describe
      - name: Execute only after separate exact source and audit review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          timeout --kill-after=5s 610s python -B control/scripts/cbf_090_default_artifact_reader.py audit --execute \
            --python "$UV_PROJECT_ENVIRONMENT/bin/python" \
            --evidence "$RUNNER_TEMP/cbf-090-byte-reader-evidence"
      - name: Retain original positive or negative light authority
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cbf-090-default-artifact-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cbf-090-byte-reader-evidence/publication/
          if-no-files-found: warn
          retention-days: 30
