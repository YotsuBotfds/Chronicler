# DORMANT: source/pure/peer/root review and separate activation required.
name: Original incomplete cohort metadata diagnostic

on:
  push:
    branches: [lead/cloud-wealth-floor-failed-cohort-diagnostic-20261029]
    paths: [.github/workflows/wealth-floor-failed-cohort-diagnostic.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: wealth-floor-failed-cohort-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Read original failed cohort metadata
    if: github.event_name == 'push' && github.ref == 'refs/heads/lead/cloud-wealth-floor-failed-cohort-diagnostic-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHON_CPU_COUNT: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      GOTO_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Check out separately reviewed diagnostic control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: control
          persist-credentials: false
      - name: Set up stdlib-only registered interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.17"
      - name: Refuse pending diagnostic registration before host probes or token use
        run: |
          python -I -B - <<'PY'
          import importlib.util,sys
          from pathlib import Path
          if importlib.util.find_spec('chronicler_agents') is not None: raise SystemExit('native extension present')
          sys.path.insert(0,str(Path('control/scripts').resolve()))
          import wealth_floor_failed_cohort_diagnostic as S
          S.registration()
          assert all(v is None for v in S.A.REVIEWED_CANDIDATE_PROOFS.values())
          assert all(getattr(S.W,k) is None for k in ('REVIEWED_OUTPUTS','REVIEWED_CLOSURES','REVIEWED_OUTCOMES','REVIEWED_RESOURCE_POLICY','REVIEWED_COMPLETION'))
          PY
      - name: Read only original exception progress and manifest metadata remotely
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B control/scripts/wealth_floor_failed_cohort_diagnostic.py --execute
      - name: Preserve bounded diagnostic metadata after the first outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wealth-floor-incomplete-cohort-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wealth-failed-cohort-diagnostic/diagnostic/
          if-no-files-found: warn
          retention-days: 30

# Archive files stay on the diagnostic VM and are excluded from publication.
# No scientific source install/build, CP state decode, fork, validator or World.
