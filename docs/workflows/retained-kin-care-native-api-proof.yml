# DORMANT: source review and a new explicit registration are required before copying.
name: Empty retained-Kin native API proof
on:
  push:
    branches: [lead/cloud-retained-kin-care-native-api-proof-20261029]
    paths: [.github/workflows/retained-kin-care-native-api-proof.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: retained-kin-care-native-api-proof
  cancel-in-progress: false
jobs:
  api:
    if: github.event_name == 'push' && github.ref == 'refs/heads/lead/cloud-retained-kin-care-native-api-proof-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      PYTHON_CPU_COUNT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      GOTO_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Check out separately reviewed API control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: control
          persist-credentials: false
      - name: Select registered interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.17"
      - name: Refuse pending registration before token or runtime setup
        run: |
          python -P -s -B -X cpu_count=1 - <<'PY'
          import importlib.util,sys
          if importlib.util.find_spec('chronicler_agents') is not None: raise SystemExit('native extension present')
          sys.path.insert(0,'control/scripts')
          import retained_kin_care_native_api_proof as P
          P.registration()
          PY
      - name: Observe only empty native public API and schema summaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -P -s -B -X cpu_count=1 control/scripts/retained_kin_care_native_api_proof.py --execute
      - name: Preserve bounded first-outcome metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-kin-care-empty-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retained-kin-care-native-api-proof/metadata/
          if-no-files-found: warn
          retention-days: 30
# No source physics imports, World/tick/restore, new wheel build or binary output.
